# Pubblica la cartella public/ su GitHub Pages a ogni push su main.
#
# Da abilitare una volta sola: Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
#
# Serve solo public/: firebase.json, scripts/ e il resto restano fuori dal sito.
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permette di rilanciarlo a mano dalla tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta; non annulla quello in corso per non lasciare il sito a metà.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configura Pages
        uses: actions/configure-pages@v5

      # GitHub Pages serve i file così come sono: nessuna build, nessuna dipendenza.
      - name: Carica public/
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
