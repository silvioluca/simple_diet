<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <title>Simple Diet</title>
    <meta name="description" content="Diario giornaliero di calorie, macro e misure corporee." />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />

    <!-- Percorsi relativi: l'app funziona sia in radice (Firebase Hosting)
         sia in una sottocartella (GitHub Pages: /nome-repo/). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Simple Diet" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  </head>
  <body>
    <!-- Splash mostrato finché Firebase non ha risolto la sessione -->
    <div id="boot" class="gate">
      <div class="gate__card">
        <div class="gate__logo" aria-hidden="true">🥗</div>
        <p class="gate__sub" style="margin:16px 0 0">Caricamento…</p>
      </div>
    </div>

    <!-- Schermata di accesso -->
    <div id="gate" class="gate" hidden>
      <div class="gate__card">
        <div class="gate__logo" aria-hidden="true">🥗</div>
        <h1>Simple Diet</h1>
        <p class="gate__sub">Calorie, macro e misure. Solo per l'account autorizzato.</p>
        <button id="login-btn" class="btn btn--google" type="button">
          <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
            <path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.3-.2-1.8H9v3.5h4.8a4 4 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.6z"/>
            <path fill="#34A853" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.5-1.8.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.3A9 9 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.9 10.7a5.4 5.4 0 0 1 0-3.4V5H.9a9 9 0 0 0 0 8l3-2.3z"/>
            <path fill="#EA4335" d="M9 3.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 .9 5l3 2.3C4.6 5.2 6.6 3.6 9 3.6z"/>
          </svg>
          Accedi con Google
        </button>
        <p id="gate-msg" class="gate__msg" role="status"></p>
      </div>
    </div>

    <!-- App -->
    <div id="app" class="app" hidden>
      <header class="topbar">
        <div class="topbar__title">
          <h1 id="view-title">Dashboard</h1>
          <p id="view-sub" class="topbar__sub"></p>
        </div>

        <div class="datenav" id="datenav">
          <button class="iconbtn" data-date-step="-1" type="button" aria-label="Giorno precedente">‹</button>
          <label class="datenav__field">
            <span class="sr-only">Data selezionata</span>
            <input type="date" id="date-input" />
          </label>
          <button class="iconbtn" data-date-step="1" type="button" aria-label="Giorno successivo">›</button>
          <button class="iconbtn iconbtn--ghost" id="today-btn" type="button" title="Vai a oggi">Oggi</button>
        </div>

        <a class="profilebtn" id="profile-link" href="#/profilo" data-route="profilo">
          <span class="avatar"><img id="avatar-img" alt="" /></span>
          <span class="profilebtn__txt" id="profile-name">Profilo</span>
        </a>
      </header>

      <main id="view" class="view" tabindex="-1"></main>

      <nav class="nav" aria-label="Sezioni">
        <a class="nav__item" href="#/dashboard" data-route="dashboard">
          <span class="nav__icon" aria-hidden="true">📊</span><span>Dashboard</span>
        </a>
        <a class="nav__item" href="#/pasti" data-route="pasti">
          <span class="nav__icon" aria-hidden="true">🍽️</span><span>Pasti</span>
        </a>
        <a class="nav__item" href="#/ricette" data-route="ricette">
          <span class="nav__icon" aria-hidden="true">📖</span><span>Ricette</span>
        </a>
        <a class="nav__item" href="#/dieta" data-route="dieta">
          <span class="nav__icon" aria-hidden="true">🎯</span><span>Dieta</span>
        </a>
        <a class="nav__item" href="#/misure" data-route="misure">
          <span class="nav__icon" aria-hidden="true">📏</span><span>Misure</span>
        </a>
      </nav>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
